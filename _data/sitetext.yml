header:
    title: "Secure the best home loan offer."
    text: "We submit your bond application to multiple banks, including your own, and we negotiate to secure the most competitive interest rate, ensuring massive savings over the term of your loan. What’s more, our service is at zero cost to you – we earn a once-off fee from the banks for each registered home loan!"
    note: "Obligation-free. Our service costs you nothing – the bank pays our fee once your home loan registers."

expert:
    title: "Buy with Confidence"
    text: "By conducting a thorough pre-approval assessment, we assist purchasers to plan & understand the level of credit that they’ll be able to secure from the banks."
    button 1 text: ""
    button 2 text: ""

nocharge:
    title: "No Charge for our Service"
    text: "We earn a once-off fee from the banks for each registered home loan. Our service is at zero cost to you."
    button 1 text: ""
    button 2 text: "Speak to an Expert"

services:
    title: "Services We Offer"
    text: "We get you the best deal on your Home Loan by sourcing quotes from all the leading banks (including your own bank) for you to compare."
    section: services
    list:
      - title: "Pre-qualification"
        desc: "Contact us before you start looking at properties. With our streamlined pre-approval process, we will give you advice around your qualifying and affordability range, as well as on improving your credit and affordability profiles."
        icon: fas fa-tasks
        link: 
          url: /contact
          text: "Contact Bond Studio"
      - title: "Bond Origination"
        desc: "We work hard on negotiating the best possible terms and interest rates for all our clients. Complete our easy Home Loan application form, and we will ensure that all your documentation is correct to be submitted to all the banks. We liaise with all the major banks (including your own bank) so that you can compare offers and choose the best home loan deal available to you. Approval, rates and final terms remain subject to each bank's assessment."
        icon: fas fas fa-home     
        link:
          url: /contact
          text: "The Bond Studio"
      - title: "Insurance"
        desc: "We offer competitive insurance products including Building Insurance and Mortgage Protection, bringing all your home loan options under one roof."
        icon: fas fa-shield-alt
        link: 
          url: /contact
          text: "The Bond Studio"


