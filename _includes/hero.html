<!-- hero.html -->
<header class="hero" id="{{ site.data.sitetext.about.section | default: 'hero' }}" aria-label="Hero Section">
  <div class="container">
    <div class="hero-content">
      <!-- Left side - Image area -->
      <div class="hero-image-container">
        <img class="hero-image"
             src="{{ '/assets/hero/homeowner-with-dog-at-window.jpg' | relative_url }}"
             srcset="{{ '/assets/hero/homeowner-with-dog-at-window-800.jpg' | relative_url }} 800w,
                     {{ '/assets/hero/homeowner-with-dog-at-window.jpg' | relative_url }} 1200w"
             sizes="(max-width: 992px) 100vw, 500px"
             width="1200" height="950"
             alt="Smiling woman playing with her dog by the window of her home"
             fetchpriority="high" decoding="async">
      </div>
      
      <!-- Right side - Text content -->
      <div class="hero-text-container">
        {%- if site.data.sitetext.header.title -%}
          <h1 class="section-heading">{{ site.data.sitetext.header.title }}</h1>
        {%- endif -%}
        
        {%- if site.data.sitetext.header.text -%}
          <p class="hero-subheading">{{ site.data.sitetext.header.text }}</p> <!-- Updated class to hero-subheading -->
        {%- endif -%}
        
        <div class="hero-buttons">
          <a class="btn btn-primary" href="{{ '/contact/' | relative_url }}">Get pre-approved</a>
          <a class="btn btn-outline" href="{{ '/contact/' | relative_url }}">Apply for a bond</a>
        </div>
<!-- 
        {%- if site.data.sitetext.header.note -%}
          <p class="hero-note">{{ site.data.sitetext.header.note }}</p>
        {%- endif -%} -->

      </div>
    </div>
  </div>
</header>
